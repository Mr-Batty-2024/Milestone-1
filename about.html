<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home | Personal Portfolio</title>

  <!-- Google Fonts Pairing: Fira Code & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>About & Contact</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="about.html">About & Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h2>Background</h2>
      <p>Placeholder biography detailing background, interests, and goals.</p>
    </section>

    <section>
      <h2>Get in Touch</h2>
      <p>Email: example@email.com</p>

      <form action="#" method="POST" class="contact-form">
        <fieldset>
          <legend>Contact Me</legend>

          <div class="form-group">
            <label for="user-name">Full Name:</label>
            <input type="text" id="user-name" name="name" required aria-required="true" />
          </div>

          <div class="form-group">
            <label for="user-email">Email Address:</label>
            <input type="email" id="user-email" name="email" required aria-required="true" />
          </div>

          <div class="form-group">
            <label for="user-message">Message:</label>
            <textarea id="user-message" name="message" rows="5" required aria-required="true"></textarea>
          </div>

          <!-- Accessible error notification container -->
          <div id="form-error" class="error-message" role="alert" aria-live="polite" style="display: none;">
            Please fill out all required fields correctly before submitting.
          </div>

          <button type="submit">Send Message</button>
        </fieldset>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Matthew Hair. All rights reserved.</p>
  </footer>

</body>
</html>
